[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coverage-repro"
version = "0.1.0"
description = "MVP reproduction for coverage-governed compositional depth extrapolation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "PyYAML>=6.0", "torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
coverage-repro = "coverage_repro.cli:main"

[tool.setuptools.packages.find]
include = ["coverage_repro*"]
